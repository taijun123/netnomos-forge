[dataset]
dataset_spec = "../../scenarios/network_cidds/dataset_spec.json"
input_path = "../../../NetNomos/data/cidds_wk2_normal_10k.csv"
rules_path = "golden/rules.json"

[model]
mode = "config"
architecture = "gpt2"

[model.config_overrides]
n_positions = 512
n_ctx = 512
n_embd = 256
n_layer = 6
n_head = 8

[serialization]
numeric_precision = 6

[training]
epochs = 3
batch_size = 16
learning_rate = 0.0005
logging_steps = 10
save_steps = 100
seed = 42

[decoding]
temperature = 1.0
do_sample = true

[run]
n_samples = 100
batch_size = 1
samples_per_prompt = 1
